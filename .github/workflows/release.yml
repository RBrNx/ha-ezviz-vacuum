name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Check version and attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/ezviz_rs20pro/manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Build zip
        run: |
          cd custom_components/ezviz_rs20pro
          zip -r "$GITHUB_WORKSPACE/ezviz_rs20pro.zip" . -x "__pycache__/*"
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ezviz_rs20pro.zip --clobber
